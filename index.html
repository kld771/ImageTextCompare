<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مقارن الوثائق الذكي</title>
    <style>
        body { font-family: sans-serif; padding: 15px; background-color: #f4f4f9; text-align: center; }
        .box { background: white; padding: 15px; border-radius: 8px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: right; }
        button { background-color: #007bff; color: white; border: none; padding: 12px 20px; border-radius: 5px; font-size: 16px; width: 100%; margin-top: 5px; cursor: pointer; }
        .btn-cam { background-color: #28a745; margin-bottom: 8px; }
        #result { background: #eef2f5; padding: 15px; border-radius: 5px; text-align: center; font-size: 16px; margin-top: 15px; font-weight: bold; line-height: 1.6; }
        .developer-tag { font-size: 13px; color: #666; margin-bottom: 15px; font-weight: bold; }
        canvas { display: none; }
    </style>
</head>
<body>

    <h2>مقارن الوثائق البصري</h2>
    <div class="developer-tag">تطوير: المهندس أبوكنان 🛠️</div>

    <!-- الصورة الأولى -->
    <div class="box">
        <label><b>الوثيقة الأولى:</b></label><br>
        <button class="btn-cam" onclick="document.getElementById('cam1').click()">📷 تصوير بالكاميرا</button>
        <input type="file" id="cam1" accept="image/*" capture="environment" style="display:none" onchange="loadImg(event, 'img1_preview', 1)">
        <label>أو اختيار من المعرض:</label>
        <input type="file" id="file1" accept="image/*" onchange="loadImg(event, 'img1_preview', 1)">
        <div id="img1_preview" style="font-size:12px; color:green; margin-top:5px;"></div>
    </div>

    <!-- الصورة الثانية -->
    <div class="box">
        <label><b>الوثيقة الثانية:</b></label><br>
        <button class="btn-cam" onclick="document.getElementById('cam2').click()">📷 تصوير بالكاميرا</button>
        <input type="file" id="cam2" accept="image/*" capture="environment" style="display:none" onchange="loadImg(event, 'img2_preview', 2)">
        <label>أو اختيار من المعرض:</label>
        <input type="file" id="file2" accept="image/*" onchange="loadImg(event, 'img2_preview', 2)">
        <div id="img2_preview" style="font-size:12px; color:green; margin-top:5px;"></div>
    </div>

    <button onclick="compareImages()" style="background-color: #007bff; font-size: 18px; padding: 15px;">مقارنة الوثيقتين الآن</button>

    <h3>النتيجة:</h3>
    <div id="result">قم باختيار أو تصوير الوثيقتين ثم اضغط على زر المقارنة...</div>

    <canvas id="canvas1"></canvas>
    <canvas id="canvas2"></canvas>

    <script>
        let imgData1 = null;
        let imgData2 = null;

        function loadImg(event, previewId, imgIndex) {
            const file = event.target.files[0];
            if (!file) return;

            document.getElementById(previewId).innerText = "تم رفع الوثيقة بنجاح ✅";

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.getElementById('canvas' + imgIndex);
                    const ctx = canvas.getContext('2d');
                    
                    // تصغير الحجم لتوحيد أبعاد المقارنة بدقة وسرعة
                    canvas.width = 150;
                    canvas.height = 200;
                    ctx.drawImage(img, 0, 0, 150, 200);
                    
                    const pixels = ctx.getImageData(0, 0, 150, 200).data;
                    if (imgIndex === 1) imgData1 = pixels;
                    if (imgIndex === 2) imgData2 = pixels;
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }

        function compareImages() {
            const resultDiv = document.getElementById('result');

            if (!imgData1 || !imgData2) {
                alert("يرجى إرفاق الوثيقتين معاً أولاً!");
                return;
            }

            resultDiv.innerText = "⏳ جاري مطابقة الوثيقتين بصرياً...";

            let matchingPixels = 0;
            let totalPixels = imgData1.length;

            // حساب نسبة التطابق البصري بين البكسلات
            for (let i = 0; i < totalPixels; i += 4) {
                let r1 = imgData1[i], g1 = imgData1[i+1], b1 = imgData1[i+2];
                let r2 = imgData2[i], g2 = imgData2[i+1], b2 = imgData2[i+2];

                // السماح بهامش تفاوت بسيط جداً للإضاءة والظلال
                if (Math.abs(r1 - r2) < 40 && Math.abs(g1 - g2) < 40 && Math.abs(b1 - b2) < 40) {
                    matchingPixels++;
                }
            }

            let similarity = Math.round((matchingPixels / (totalPixels / 4)) * 100);

            // رفع الحساسية لتكون المطابق صارمة للوثائق
            if (similarity >= 80) {
                resultDiv.innerHTML = `<span style='color:green;'>✅ الوثيقتان متطابقتان تماماً!<br>(نسبة التطابق البصري: ${similarity}%)</span>`;
            } else {
                resultDiv.innerHTML = `<span style='color:red;'>❌ الوثيقتان غير متطابقتين!<br>(نسبة التطابق البصري: ${similarity}%)</span>`;
            }
        }
    </script>
</body>
</html>
