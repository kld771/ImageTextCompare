<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مقارن الوثائق - Magic Pro</title>
    <style>
        body { font-family: sans-serif; padding: 15px; background-color: #f4f4f9; text-align: center; }
        .box { background: white; padding: 15px; border-radius: 8px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: right; }
        button { background-color: #007bff; color: white; border: none; padding: 12px 20px; border-radius: 5px; font-size: 16px; width: 100%; margin-top: 5px; cursor: pointer; }
        .btn-cam { background-color: #28a745; margin-bottom: 8px; }
        #result { background: #eef2f5; padding: 15px; border-radius: 5px; text-align: center; font-size: 16px; margin-top: 15px; font-weight: bold; line-height: 1.6; }
        .developer-tag { font-size: 13px; color: #666; margin-bottom: 15px; font-weight: bold; }
        .preview-canvas { display: block; margin: 10px auto; max-width: 130px; border: 1px solid #ccc; border-radius: 4px; background: white; }
        .hidden-canvas { display: none; }
    </style>
</head>
<body>

    <h2>مقارن الوثائق (Magic Pro)</h2>
    <div class="developer-tag">تطوير: المهندس أبوكنان 🛠️</div>

    <!-- الوثيقة الأولى -->
    <div class="box">
        <label><b>الوثيقة الأولى:</b></label><br>
        <button class="btn-cam" onclick="document.getElementById('file1').click()">📷 تصوير أو اختيار الوثيقة</button>
        <input type="file" id="file1" accept="image/*" style="display:none" onchange="applyTrueMagicPro(event, 1)">
        <canvas id="prevCanvas1" class="preview-canvas"></canvas>
        <div id="status1" style="font-size:12px; color:green; text-align:center;">لم يتم إرفاق وثيقة</div>
    </div>

    <!-- الوثيقة الثانية -->
    <div class="box">
        <label><b>الوثيقة الثانية:</b></label><br>
        <button class="btn-cam" onclick="document.getElementById('file2').click()">📷 تصوير أو اختيار الوثيقة</button>
        <input type="file" id="file2" accept="image/*" style="display:none" onchange="applyTrueMagicPro(event, 2)">
        <canvas id="prevCanvas2" class="preview-canvas"></canvas>
        <div id="status2" style="font-size:12px; color:green; text-align:center;">لم يتم إرفاق وثيقة</div>
    </div>

    <button onclick="compareTrueDocuments()" style="background-color: #007bff; font-size: 18px; padding: 15px;">مقارنة الوثيقتين الآن</button>

    <h3>النتيجة:</h3>
    <div id="result">قم بتصوير أو إرفاق الوثيقتين ثم اضغط على زر المقارنة...</div>

    <canvas id="hiddenCanvas1" class="hidden-canvas"></canvas>
    <canvas id="hiddenCanvas2" class="hidden-canvas"></canvas>

    <script>
        let processedData1 = null;
        let processedData2 = null;

        function applyTrueMagicPro(event, docIndex) {
            const file = event.target.files[0];
            if (!file) return;

            document.getElementById('status' + docIndex).innerText = "⏳ جاري المعالجة وتطبيق Magic Pro...";

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.getElementById('hiddenCanvas' + docIndex);
                    const ctx = canvas.getContext('2d');
                    
                    const width = 300;
                    const height = 420;
                    canvas.width = width;
                    canvas.height = height;

                    ctx.drawImage(img, 0, 0, width, height);
                    const imgData = ctx.getImageData(0, 0, width, height);
                    const pixels = imgData.data;

                    let gray = new Float32Array(width * height);
                    for (let i = 0; i < pixels.length; i += 4) {
                        gray[i / 4] = 0.299 * pixels[i] + 0.587 * pixels[i+1] + 0.114 * pixels[i+2];
                    }

                    let output = new Uint8ClampedArray(pixels.length);
                    let S = 25; 
                    let C = 10; 

                    let integral = new Float64Array(width * height);
                    for (let y = 0; y < height; y++) {
                        let sum = 0;
                        for (let x = 0; x < width; x++) {
                            sum += gray[y * width + x];
                            if (y === 0) {
                                integral[y * width + x] = sum;
                            } else {
                                integral[y * width + x] = integral[(y - 1) * width + x] + sum;
                            }
                        }
                    }

                    for (let y = 0; y < height; y++) {
                        for (let x = 0; x < width; x++) {
                            let idx = y * width + x;
                            let x1 = Math.max(0, x - S);
                            let x2 = Math.min(width - 1, x + S);
                            let y1 = Math.max(0, y - S);
                            let y2 = Math.min(height - 1, y + S);
                            let count = (x2 - x1) * (y2 - y1);
                            
                            let sum = integral[y2 * width + x2] - 
                                      (y1 > 0 ? integral[(y1 - 1) * width + x2] : 0) - 
                                      (x1 > 0 ? integral[y2 * width + (x1 - 1)] : 0) + 
                                      ((y1 > 0 && x1 > 0) ? integral[(y1 - 1) * width + (x1 - 1)] : 0);
                            
                            let mean = sum / count;
                            let val = gray[idx] < (mean * (1.0 - C / 100.0)) ? 0 : 255;

                            let pIdx = idx * 4;
                            output[pIdx] = val;
                            output[pIdx+1] = val;
                            output[pIdx+2] = val;
                            output[pIdx+3] = 255;
                        }
                    }

                    const finalImgData = new ImageData(output, width, height);
                    ctx.putImageData(finalImgData, 0, 0);

                    // معاينة الصورة المصغرة المصفاة
                    const prevCanvas = document.getElementById('prevCanvas' + docIndex);
                    prevCanvas.width = 100;
                    prevCanvas.height = 140;
                    const prevCtx = prevCanvas.getContext('2d');
                    prevCtx.drawImage(canvas, 0, 0, 100, 140);

                    if (docIndex === 1) processedData1 = output;
                    if (docIndex === 2) processedData2 = output;

                    document.getElementById('status' + docIndex).innerText = "تمت معالجة وثيقة Magic Pro بنجاح ✅";
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }

        function compareTrueDocuments() {
            const resultDiv = document.getElementById('result');

            if (!processedData1 || !processedData2) {
                alert("يرجى إرفاق الوثيقتين معاً أولاً!");
                return;
            }

            resultDiv.innerText = "⏳ جاري المطابقة بدقة فائقة...";

            let matchingPixels = 0;
            let totalPixels = processedData1.length;

            for (let i = 0; i < totalPixels; i += 4) {
                if (processedData1[i] === processedData2[i]) {
                    matchingPixels++;
                }
            }

            let similarity = Math.round((matchingPixels / (totalPixels / 4)) * 100);

            if (similarity >= 82) {
                resultDiv.innerHTML = `<span style='color:green;'>✅ الوثيقتان متطابقتان تماماً!<br>(نسبة التطابق بفلتر Magic Pro: ${similarity}%)</span>`;
            } else {
                resultDiv.innerHTML = `<span style='color:red;'>❌ الوثيقتان غير متطابقتين!<br>(نسبة التطابق بفلتر Magic Pro: ${similarity}%)</span>`;
            }
        }
    </script>
</body>
</html>
