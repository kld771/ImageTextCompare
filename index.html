<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مقارن النصوص الحرفي</title>
    <style>
        body { font-family: sans-serif; padding: 15px; background-color: #f4f4f9; text-align: center; }
        .box { background: white; padding: 15px; border-radius: 8px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: right; }
        button { background-color: #007bff; color: white; border: none; padding: 12px 20px; border-radius: 5px; font-size: 16px; width: 100%; margin-top: 5px; cursor: pointer; }
        .btn-cam { background-color: #28a745; margin-bottom: 8px; }
        #result { background: #eef2f5; padding: 12px; border-radius: 5px; text-align: right; white-space: pre-wrap; font-size: 14px; margin-top: 15px; line-height: 1.6; }
        .developer-tag { font-size: 13px; color: #666; margin-bottom: 15px; font-weight: bold; }
    </style>
    <!-- مكتبة Tesseract -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>

    <h2>مقارن النصوص الحرفي للوثائق</h2>
    <div class="developer-tag">تطوير: المهندس أبوكنان 🛠️</div>

    <!-- الصورة الأولى -->
    <div class="box">
        <label><b>الصورة الأولى:</b></label><br>
        <button class="btn-cam" onclick="document.getElementById('cam1').click()">📷 تصوير بالكاميرا</button>
        <input type="file" id="cam1" accept="image/*" capture="environment" style="display:none" onchange="previewImage(event, 'prev1')">
        <label>أو اختيار من المعرض:</label>
        <input type="file" id="img1" accept="image/*" onchange="previewImage(event, 'prev1')">
        <div id="prev1" style="font-size:12px; color:green; margin-top:5px;"></div>
    </div>

    <!-- الصورة الثانية -->
    <div class="box">
        <label><b>الصورة الثانية:</b></label><br>
        <button class="btn-cam" onclick="document.getElementById('cam2').click()">📷 تصوير بالكاميرا</button>
        <input type="file" id="cam2" accept="image/*" capture="environment" style="display:none" onchange="previewImage(event, 'prev2')">
        <label>أو اختيار من المعرض:</label>
        <input type="file" id="img2" accept="image/*" onchange="previewImage(event, 'prev2')">
        <div id="prev2" style="font-size:12px; color:green; margin-top:5px;"></div>
    </div>

    <button onclick="processAndCompare()" style="background-color: #007bff; font-size: 18px; padding: 15px;">مقارنة حرفية الآن</button>

    <h3>النتيجة:</h3>
    <div id="result">قم باختيار أو تصوير الصورتين ثم اضغط على زر المقارنة...</div>

    <script>
        function previewImage(event, prevId) {
            const file = event.target.files[0];
            if (file) {
                document.getElementById(prevId).innerText = "تم إدراج الصورة بنجاح ✅";
            }
        }

        function cleanArabicText(text) {
            if (!text) return "";
            return text
                .replace(/[\u064B-\u0652]/g, "") // إزالة التشكيل
                .replace(/[\r\n]+/g, ' ')        // توحيد الأسطر
                .replace(/\s+/g, ' ')            // توحيد المسافات
                .trim();
        }

        async function processAndCompare() {
            const resultDiv = document.getElementById('result');
            const file1 = document.getElementById('cam1').files[0] || document.getElementById('img1').files[0];
            const file2 = document.getElementById('cam2').files[0] || document.getElementById('img2').files[0];

            if (!file1 || !file2) {
                alert("يرجى اختيار الصورتين أولاً!");
                return;
            }

            resultDiv.innerText = "⏳ يرجى الاتصال بالإنترنت مؤقتاً لأول مرة لتحميل ملفات اللغة العربية...\nجاري قراءة النصوص المعالجة...";

            try {
                // استخدام اللغة العربية وحدها (ara) لضمان دقة قراءة الحروف العربية وعدم تداخل الرموز الإنجليزية
                const worker1 = await Tesseract.createWorker('ara');
                const ret1 = await worker1.recognize(file1);
                const rawText1 = ret1.data.text;
                await worker1.terminate();

                const worker2 = await Tesseract.createWorker('ara');
                const ret2 = await worker2.recognize(file2);
                const rawText2 = ret2.data.text;
                await worker2.terminate();

                const t1 = cleanArabicText(rawText1);
                const t2 = cleanArabicText(rawText2);

                if (t1 === t2 && t1 !== "") {
                    resultDiv.innerHTML = "<b style='color:green; font-size:16px;'>✅ النصان متطابقان حرفياً تماماً!</b>\n\n<b>النص المطابق:</b>\n" + t1;
                } else {
                    resultDiv.innerHTML = "<b style='color:red; font-size:16px;'>❌ النصان غير متطابقين حرفياً!</b>\n\n" +
                                          "<b>--- النص الأول ---</b>\n" + (t1 || "[لم يُقرأ نص]") + "\n\n" +
                                          "-----------------------------------------\n" +
                                          "<b>--- النص الثاني ---</b>\n" + (t2 || "[لم يُقرأ نص]");
                }

            } catch (err) {
                resultDiv.innerText = "حدث خطأ أثناء قراءة الصور: " + err.message;
            }
        }
    </script>
</body>
</html>
